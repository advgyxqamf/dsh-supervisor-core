<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dsh-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-supervisor · 控制面板</title>
    <style>
      /* 品牌启动壳（内联：须在任何 JS 之前可见；React 挂载后即被替换）。
         资源一致性由架构保证：HTML no-store + 资源内容哈希 + 宿主每次重新导航，
         因此这里不需要任何"自愈/强制刷新"脚本。 */
      :root {
        font-family: Inter, "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
        background: transparent;
      }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; height: 100dvh; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      .startup-shell {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgb(47 84 235 / 10%), transparent 30%),
          #FAFBFC;
      }
      .startup-brand { display: grid; justify-items: center; gap: 18px; width: min(280px, calc(100% - 48px)); }
      .startup-logo {
        position: relative;
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border: 1px solid rgb(47 84 235 / 14%);
        border-radius: 999px;
        background: linear-gradient(145deg, rgb(255 255 255 / 96%), rgb(239 245 242 / 92%));
        box-shadow: 0 18px 42px rgb(15 23 42 / 10%), inset 0 1px 0 rgb(255 255 255 / 90%);
        color: #2F54EB;
      }
      .startup-logo::after {
        position: absolute;
        inset: -7px;
        content: "";
        border-radius: 999px;
        border: 2px solid rgb(47 84 235 / 10%);
        border-top-color: #2F54EB;
        animation: startup-spin 960ms linear infinite;
      }
      .startup-logo-image {
        width: 42px;
        height: 42px;
        background: currentColor;
        mask: url("/dsh-logo.svg") center / contain no-repeat;
        -webkit-mask: url("/dsh-logo.svg") center / contain no-repeat;
      }
      .startup-copy { display: grid; gap: 7px; justify-items: center; text-align: center; }
      .startup-name { color: #0F1115; font-size: 22px; font-weight: 760; line-height: 1; }
      .startup-status { color: #6b747d; font-size: 13px; line-height: 1.4; }
      .startup-progress {
        position: relative;
        width: 100%;
        height: 3px;
        margin-top: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #DDE3EC;
      }
      .startup-progress::after {
        display: block;
        width: 42%;
        height: 100%;
        content: "";
        animation: startup-progress 1.15s ease-in-out infinite;
        border-radius: inherit;
        background: #2F54EB;
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @keyframes startup-progress {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell" aria-label="dsh-supervisor 正在启动">
        <section class="startup-brand">
          <div class="startup-logo" aria-hidden="true">
            <span class="startup-logo-image"></span>
          </div>
          <div class="startup-copy">
            <strong class="startup-name">DSH-SUP</strong>
            <span class="startup-status">正在连接守卫服务…</span>
          </div>
          <div class="startup-progress" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <script type="module" crossorigin src="/src/main-supervisor.tsx"></script>
  </body>
</html>
