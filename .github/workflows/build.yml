name: build-release

# 私有内核仓产线（DESIGN §16.4 + 2026-09 双仓拆分：壳已剥离至公开仓 dsh-supervisor-launcher，本仓只管内核 npm 子包）。
# tag v<内核版本> → verify + build:launcher + npm 子包发布；壳的构建/冒烟/安装程序归壳仓 launcher-build.yml。
#
# 平台分工（2026-09-11 定案，GitHub 额度优化）：
#   - **推荐路径：全平台本地生产** `npm run release:core:all:publish`
#     launcher 是纯 JS 产物（内核 0 依赖 / 产物 0 个 .node），平台差异仅在 npm 元数据，
#     故一台 Linux 即可产出四个平台的正确产物，**完全不消耗 GitHub 额度**。
#     本地发布后本 workflow 仍会因 tag 而触发，但 `precheck` 会发现「本版已全部发布」
#     并**跳过整个 mac/win 矩阵**（约 1 分钟 ubuntu prep vs 约 110 分钟含 macOS 10x 计费）。
#   - **兜底路径：CI 产 mac/win**。若本地只发了部分平台（或不发），precheck 判定需要构建，
#     则由本矩阵补齐。因此 tag 推送在任何情况下都能收敛到「四平台齐备」。
#   本矩阵**不含 ubuntu**——linux-x64 由本地生产；若加回会形成同平台二次发布（npm 拒绝）。
on:
  push:
    tags:
      - 'v*'
    # P1-B（2026-09-12）：日常推送也要跑回归 —— 见下方 `test` job 的说明。
    branches:
      - master
  pull_request:
  workflow_dispatch: {}

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # test：内核回归测试（P1-B 接线，2026-09-12）
  #
  # ⚠ 为什么必须单独加这个 job：
  #   此前 `npm test` **没有 Linux 执行点** —— 构建矩阵只有 win/mac（Linux 由本地生产），
  #   而 `ci-core.sh`（内含 npm test）只在 tag + need_build 时、在 win/mac runner 上跑。
  #   于是「平台能力矩阵由可执行断言支撑」这条不变量在产线上不成立：
  #   改坏 platform/os/ 或版本映射，CI 依然全绿。
  #
  #   本 job 只做测试，**不构建、不发布** —— 纯 JS 项目，ubuntu-latest 约 1 分钟（1x 计费），
  #   不触碰「Linux 不在 CI 生产」的既有额度决策（那条针对的是**发布**）。
  # ══════════════════════════════════════════════════════════════════════════
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 构建前端产物（npm test 的面板安全头断言**依赖它**）
        shell: bash
        # ⚠ 2026-09-13 修复（P1）：**必须先构建前端**，否则 core-test 的两条安全头断言
        #   （「面板带 CSP 头」/「nosniff 头存在」）会因静态分支返回 HTTP 503
        #   「UI not built」而失败 —— 而它们正是**面板安全头**的唯一门禁。
        #
        #   缺陷本质：core-test.js 的注释已写明流水线顺序是
        #     verify → build-ui → npm test（见 release/scripts/ci-core.sh），
        #   但本 job **只跑 npm test**，把「构建产物」这个**断言前置条件**漏掉了。
        #   为什么长期不可见：branches:[master] 于 2026-09-12 接入后，
        #     到我 2026-09-13 推送之前 **master 从无 push**（Actions 里该分支的 push
        #     run 总数 = 2，都是我的）→ 本 job **从未运行过**，
        #   一运行即红（run 34737621965：37 passed / 2 failed）。
        #   修法选择「真的构建」而不是「让断言跳过」—— 跳过等于把安全头门禁删掉。
        run: bash release/scripts/build-ui.sh

      - name: 内核回归测试（npm test）
        shell: bash
        run: |
          # 不截断：门禁失败时断言文案就是排障依据。
          set -o pipefail
          npm test 2>&1 | tail -60

  # ── precheck：该 tag 版本是否已在 npm 全部发布？ ──
  # 为什么需要：全平台本地发布后，tag 仍会触发本 workflow。若无此判断，
  #   每次发布都会白烧一轮 mac/win 矩阵（macOS 按 10x 计费，约 110 分钟/次）。
  #   有它则退化为一次 ubuntu 探测（约 1 分钟，1x），把额度消耗降低约 99%。
  # 判据：package.json#npmPublish.packages 声明的**每个**平台子包，在该版本下是否都已存在于 npm。
  precheck:
    runs-on: ubuntu-latest
    outputs:
      need_build: ${{ steps.probe.outputs.need_build }}
      missing: ${{ steps.probe.outputs.missing }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 探测该版本是否已全部发布
        id: probe
        shell: bash
        run: |
          VER="$(node -p "require('./package.json').version")"
          echo "  版本: $VER"
          MISSING=""
          for p in $(node -e 'const p=require("./package.json");console.log((p.npmPublish&&p.npmPublish.packages||[]).join(" "))'); do
            if npm view "@dsh-sup/$p@$VER" version >/dev/null 2>&1; then
              echo "    已发布 $p"
            else
              echo "    缺失   $p"
              MISSING="$MISSING $p"
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            echo "  → 四平台已齐备，**跳过构建矩阵**（省额度）"
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
            echo "  → 需由 CI 补齐：$MISSING"
          fi

  build:
    needs: precheck
    # 已全部发布则无需再构建（本地已用同一份代码产出，幂等）。
    if: needs.precheck.outputs.need_build == 'true'
    # 本 job 只负责构建与发布 npm 子包（不再直接挂 Release，见文件末尾 release job 的说明）。
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 不在 CI 生产（2026-09 定案，额度优化）：linux-x64 子包改由**本地**
          # `npm run release:core:publish` 在 Linux 机器上构建并直推 npm（见 release-core.sh）；
          # tag 推送后本矩阵仅负责 macOS/Windows 三平台（win-x64 / darwin-arm64 / darwin-x64）。
          # 注意：因此 Linux 的 launcher 资产不再挂到 GitHub Release（npm 是其分发通道）。
          - os: windows-latest
            artifact: win-x64
            arch_override: ""
          - os: macos-latest
            artifact: darwin-arm64
            arch_override: ""
            # GitHub 已无 Intel macOS runner（macos-13 弃用、macos-14 亦为 arm64）。
            # launcher 为架构无关纯 JS，仅 npm os/cpu 元数据区分——darwin-x64 用 macos-14(arm64)
            # + DSH_ARCH_OVERRIDE=x64 构建（产物相同，仅包名/元数据不同）。
          - os: macos-14
            artifact: darwin-x64
            arch_override: x64
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DSH_ARCH_OVERRIDE: ${{ matrix.arch_override }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 发布产线核心逻辑单源：release/scripts/ci-core.sh（本机亦可复跑）。
      # 内核 launcher 为纯 JS（Node ≥18 运行时），无需 Rust/系统库依赖。
      # tag v<内核> 触发器 + 存有 NPM_TOKEN 时方 --publish 真发（无 token 一律仅验证）。
      - name: 内核发布产线（verify + build:launcher + 子包发布 / dry-run）
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] && [ -n "$NPM_TOKEN" ]; then
            bash release/scripts/ci-core.sh --publish
          else
            bash release/scripts/ci-core.sh
          fi

      - name: Upload artifacts（内核 launcher 构建物）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/launcher/**
            dist/launcher/README.md

  # ── Release 附加：**单独一个 job，只跑一次** ──
  # 为什么不能放在 build 矩阵里（2026-09-11 修复，实测 CI #19）:
  #   矩阵 3 个 job（win/mac-arm64/mac-x64）会**并发**向同一个 Release 上传资产，
  #   产生竞态：实测 darwin-x64 成功、darwin-arm64 在同一步骤失败。
  #   且各平台的 dist/launcher/** 内含**同名文件**（如 core.cjs），直接挂会互相覆盖/冲突。
  # 现改为：build 只上传 artifact → 本 job 汇总、按平台打成**唯一命名**的 tar.gz 后一次性挂载。
  release:
    needs: [precheck, build]
    # 需要 build 真正跑过（跳过 build 时没有 artifact 可汇总，故不挂 Release）。
    if: startsWith(github.ref, 'refs/tags/v') && needs.precheck.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 挂 Release 需 GITHUB_TOKEN contents:write
    steps:
      - uses: actions/checkout@v4

      - name: 收集各平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 按平台打包为唯一命名的 tar.gz
        shell: bash
        run: |
          VER="$(node -p "require('./package.json').version")"
          mkdir -p out
          echo "  版本: $VER"
          # ⚠ artifact 内的布局取决于 upload-artifact 的路径剥离（实测 CI #23）：
          #   上传 `path: dist/launcher/**` 时，它以**最小公共祖先** dist/launcher 为根，
          #   故下载后 artifact 根目录**直接就是** launcher 的内容，不含 dist/launcher 前缀。
          #   两种形态都兼容，避免路径假设变化导致打包为空。
          for d in artifacts/*/; do
            plat="$(basename "$d")"
            if [ -d "$d/dist/launcher" ]; then SRC="$d/dist/launcher"; else SRC="$d"; fi
            echo "  打包 $plat ← $SRC"
            tar -czf "out/dsh-supervisor-launcher-$VER-$plat.tar.gz" -C "$SRC" .
          done
          echo "  产物:"
          ls -lh out/ | sed "s/^/    /"
          # 断言：必须有产物，否则「静默挂空 Release」比失败更糟
          if [ -z "$(ls -A out 2>/dev/null)" ]; then echo "::error::未生成任何 Release 资产"; exit 1; fi

      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tar.gz
          generate_release_notes: true

  # 前端门禁（typecheck/lint/test/build）**已移出 CI**（2026-09 定案，额度优化）：
  #   原 ui-verify 作业常驻 ubuntu-latest，是矩阵去 ubuntu 后唯一的 Linux 消耗。
  #
  # ⚠ 2026-09-12 校正：此处原写「现由本地发布前置（release-core.sh 的 [3/7] UI 门禁）承担」——
  #   但 (a) `release-core.sh` 只有 **[1/5]–[3/5]**，**不存在 [3/7]**；
  #       (b) 其 [3/5] 委托的 `ci-core.sh` 只调 `build-ui.sh`，而后者**只构建、不测试**。
  #   即：`ui/package.json` 里的 `typecheck`/`lint`/`vitest` 与 3 个 .test.ts
  #   **在任何自动化路径上都不会被执行** —— 声称的「UI 门禁」实际不存在。
  #
  #   现由 `ci-core.sh` 的 [1/5] 显式执行 `ui` 的 `verify`（typecheck + lint + test + build），
  #   故本地发布与 CI 两条路径都真正跑到了前端门禁。