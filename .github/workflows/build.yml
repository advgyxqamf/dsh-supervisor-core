name: build-release

# 私有内核仓产线（DESIGN §16.4 + 2026-09 双仓拆分：壳已剥离至公开仓 dsh-supervisor-launcher，本仓只管内核 npm 子包）。
# tag v<内核版本> → verify + build:launcher + npm 子包发布；壳的构建/冒烟/安装程序归壳仓 launcher-build.yml。
#
# 平台分工（2026-09 定案，GitHub 额度优化）：
#   - **linux-x64**：**本地生产**。在 Linux 机器执行 `npm run release:core:publish`——
#     走 ci-core.sh 完整门禁后直推 npm，再 commit+tag+push 触发本 workflow 的 mac/win 矩阵。
#   - **win-x64 / darwin-arm64 / darwin-x64**：GitHub CI 生产（本文件矩阵）。
#   故本矩阵**不含 ubuntu**——若加回，会与本地发布形成同版本二次发布（npm 拒绝）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    # 本 job 只负责构建与发布 npm 子包（不再直接挂 Release，见文件末尾 release job 的说明）。
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 不在 CI 生产（2026-09 定案，额度优化）：linux-x64 子包改由**本地**
          # `npm run release:core:publish` 在 Linux 机器上构建并直推 npm（见 release-core.sh）；
          # tag 推送后本矩阵仅负责 macOS/Windows 三平台（win-x64 / darwin-arm64 / darwin-x64）。
          # 注意：因此 Linux 的 launcher 资产不再挂到 GitHub Release（npm 是其分发通道）。
          - os: windows-latest
            artifact: win-x64
            arch_override: ""
          - os: macos-latest
            artifact: darwin-arm64
            arch_override: ""
            # GitHub 已无 Intel macOS runner（macos-13 弃用、macos-14 亦为 arm64）。
            # launcher 为架构无关纯 JS，仅 npm os/cpu 元数据区分——darwin-x64 用 macos-14(arm64)
            # + DSH_ARCH_OVERRIDE=x64 构建（产物相同，仅包名/元数据不同）。
          - os: macos-14
            artifact: darwin-x64
            arch_override: x64
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DSH_ARCH_OVERRIDE: ${{ matrix.arch_override }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 发布产线核心逻辑单源：release/scripts/ci-core.sh（本机亦可复跑）。
      # 内核 launcher 为纯 JS（Node ≥18 运行时），无需 Rust/系统库依赖。
      # tag v<内核> 触发器 + 存有 NPM_TOKEN 时方 --publish 真发（无 token 一律仅验证）。
      - name: 内核发布产线（verify + build:launcher + 子包发布 / dry-run）
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] && [ -n "$NPM_TOKEN" ]; then
            bash release/scripts/ci-core.sh --publish
          else
            bash release/scripts/ci-core.sh
          fi

      - name: Upload artifacts（内核 launcher 构建物）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/launcher/**
            dist/launcher/README.md

  # ── Release 附加：**单独一个 job，只跑一次** ──
  # 为什么不能放在 build 矩阵里（2026-09-11 修复，实测 CI #19）:
  #   矩阵 3 个 job（win/mac-arm64/mac-x64）会**并发**向同一个 Release 上传资产，
  #   产生竞态：实测 darwin-x64 成功、darwin-arm64 在同一步骤失败。
  #   且各平台的 dist/launcher/** 内含**同名文件**（如 core.cjs），直接挂会互相覆盖/冲突。
  # 现改为：build 只上传 artifact → 本 job 汇总、按平台打成**唯一命名**的 tar.gz 后一次性挂载。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 挂 Release 需 GITHUB_TOKEN contents:write
    steps:
      - uses: actions/checkout@v4

      - name: 收集各平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 按平台打包为唯一命名的 tar.gz
        shell: bash
        run: |
          VER="$(node -p "require('./package.json').version")"
          mkdir -p out
          echo "  版本: $VER"
          # ⚠ artifact 内的布局取决于 upload-artifact 的路径剥离（实测 CI #23）：
          #   上传 `path: dist/launcher/**` 时，它以**最小公共祖先** dist/launcher 为根，
          #   故下载后 artifact 根目录**直接就是** launcher 的内容，不含 dist/launcher 前缀。
          #   两种形态都兼容，避免路径假设变化导致打包为空。
          for d in artifacts/*/; do
            plat="$(basename "$d")"
            if [ -d "$d/dist/launcher" ]; then SRC="$d/dist/launcher"; else SRC="$d"; fi
            echo "  打包 $plat ← $SRC"
            tar -czf "out/dsh-supervisor-launcher-$VER-$plat.tar.gz" -C "$SRC" .
          done
          echo "  产物:"
          ls -lh out/ | sed "s/^/    /"
          # 断言：必须有产物，否则「静默挂空 Release」比失败更糟
          if [ -z "$(ls -A out 2>/dev/null)" ]; then echo "::error::未生成任何 Release 资产"; exit 1; fi

      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tar.gz
          generate_release_notes: true

  # 前端门禁（typecheck/lint/test/build）**已移出 CI**（2026-09 定案，额度优化）：
  #   原 ui-verify 作业常驻 ubuntu-latest，是矩阵去 ubuntu 后唯一的 Linux 消耗。
  #   现由本地发布前置（release-core.sh 的 [3/7] UI 门禁）承担——本地免费且与 Linux 生产同机，
  #   **每次 release:core* 都会执行**（含 build-ui 镜像构建），不会漏跑。