name: build-release

# 私有内核仓产线（DESIGN §16.4 + 2026-09 双仓拆分：壳已剥离至公开仓 dsh-supervisor-launcher，本仓只管内核 npm 子包）。
# tag v<内核版本> → verify + build:launcher + npm 子包发布；壳的构建/冒烟/安装程序归壳仓 launcher-build.yml。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            arch_override: ""
          - os: windows-latest
            artifact: win-x64
            arch_override: ""
          - os: macos-latest
            artifact: darwin-arm64
            arch_override: ""
            # GitHub 已无 Intel macOS runner（macos-13 弃用、macos-14 亦为 arm64）。
            # launcher 为架构无关纯 JS，仅 npm os/cpu 元数据区分——darwin-x64 用 macos-14(arm64)
            # + DSH_ARCH_OVERRIDE=x64 构建（产物相同，仅包名/元数据不同）。
          - os: macos-14
            artifact: darwin-x64
            arch_override: x64
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DSH_ARCH_OVERRIDE: ${{ matrix.arch_override }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 发布产线核心逻辑单源：release/scripts/ci-core.sh（本机亦可复跑）。
      # 内核 launcher 为纯 JS（Node ≥18 运行时），无需 Rust/系统库依赖。
      # tag v<内核> 触发器 + 存有 NPM_TOKEN 时方 --publish 真发（无 token 一律仅验证）。
      - name: 内核发布产线（verify + build:launcher + 子包发布 / dry-run）
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] && [ -n "$NPM_TOKEN" ]; then
            bash release/scripts/ci-core.sh --publish
          else
            bash release/scripts/ci-core.sh
          fi

      - name: Upload artifacts（内核 launcher 构建物）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/launcher/**
            dist/launcher/README.md

      - name: Attach to GitHub Release（内核 launcher 构建物）
        uses: softprops/action-gh-release@v2
        with:
          files: dist/launcher/**
          generate_release_notes: true

  # ---- 前端门禁（Phase 2：一源双出口的 verify；独立 job 单平台跑一次，避免矩阵重复）----
  ui-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 前端 verify（typecheck/lint/test/build）
        shell: bash
        run: |
          cd ui
          npm ci
          npm run verify

      - name: 构建 UI 发布镜像（build-ui.sh → ui-react/）
        shell: bash
        run: |
          bash release/scripts/build-ui.sh --skip-install
          test -f ui-react/supervisor.html